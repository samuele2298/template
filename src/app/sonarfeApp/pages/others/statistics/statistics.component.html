<!-- Table Section -->
<div class="statistics-table">
    <clr-datagrid>
        <clr-dg-column>Date</clr-dg-column>
        <clr-dg-column>Count</clr-dg-column>
        <clr-dg-column>Margin</clr-dg-column>
        <clr-dg-column>Fee</clr-dg-column>

        <clr-dg-row *clrDgItems="let statistic of statistics">
            <clr-dg-cell>{{ statistic.date | date:'yyyy/MM/dd':'UTC' }}</clr-dg-cell>
            <clr-dg-cell>{{ statistic.count }}</clr-dg-cell>
            <clr-dg-cell>{{ formatNumber(statistic.margin) }}</clr-dg-cell>
            <clr-dg-cell>{{ formatNumber(statistic.fee) }}</clr-dg-cell>
        </clr-dg-row>
    </clr-datagrid>
</div>
