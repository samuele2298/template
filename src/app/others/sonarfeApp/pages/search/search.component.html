


<div class="header-container">
    <button type="button" class="btn btn-icon" aria-label="home" (click)="goBack()">
        <cds-icon shape="arrow" direction="left"></cds-icon>
    </button>
    <h3 style="margin: 0;">Search for: "{{search_query}}" </h3>
</div>
<div class="metric" >
    <div class="metric-container" *ngFor="let f of filteredSearch" (click)="navigateTo(f.path)" >
        <div class="data">{{ f.path.split('/')[0] == 'category' ? 'Category': 'Coin' }}</div>
        <div class="value">{{ f.name }}</div>
    </div>
</div>
